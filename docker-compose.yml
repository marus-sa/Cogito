services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cogito
      POSTGRES_USER: cogito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://cogito:${POSTGRES_PASSWORD}@database:5432/cogito
      FLASK_ENV: development
    depends_on:
      - database

volumes:
  postgres_data:
