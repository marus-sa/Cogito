services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cogito
      POSTGRES_USER: cogito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cogito -d cogito']
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - '5000:5000'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cogito:${POSTGRES_PASSWORD}@database:5432/cogito
      FLASK_ENV: development
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
