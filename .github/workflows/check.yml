name: Проверка Cogito

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: npm run test:client
      - run: python -m venv server/.venv
      - run: server/.venv/bin/pip install -r server/requirements.txt
      - run: npm run test:api
      - run: npm run test:accounts
      - name: Проверка контейнеризации
        run: docker build --tag cogito:test .
