services:
  - type: web
    name: cogito-light-hearts
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        # Строка подключения внешней PostgreSQL (например, Neon Free).
        # Существующую базу Render этот файл не удаляет.
        sync: false
      - key: FLASK_ENV
        value: production
      # Адрес, который попадает в ссылку из письма подтверждения.
      - key: APP_URL
        value: https://cogito-light-hearts.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # Заполняется вручную только на время аварийного восстановления
      # администратора. Значение не попадает в Git и не выводится сайту.
      - key: ADMIN_RESET_TOKEN
        sync: false
      # SMTP-данные добавляются только в Render как секреты, не в Git.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: Cogito — Light Hearts
      - key: SMTP_USE_TLS
        value: '1'
      - key: SMTP_USE_SSL
        value: '0'
