services:
  - type: web
    name: cogito-light-hearts
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cogito-light-hearts-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

databases:
  - name: cogito-light-hearts-db
    databaseName: cogito
    user: cogito
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
